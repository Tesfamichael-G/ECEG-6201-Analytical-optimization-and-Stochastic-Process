site_name: ECEG-6201 — Analytical Optimization and Stochastic Processes
site_description: MSc in Communication Engineering · Year 1, Semester I
site_author: Dr. Tesfamichael Gebregziabher
site_url: https://tesfamichael-g.github.io/ECEG-6201-Analytical-optimization-and-Stochastic-Process/
#repo_url: https://github.com/<your-username>/eceg-6201
#repo_name: <your-username>/eceg-6201

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/chart-bell-curve-cumulative
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Schedule: schedule.md
  - Chapters:
      - 1. Optimization — Preliminaries: chapters/01-optimization-preliminaries.md
      - 2. Unconstrained Optimization: chapters/02-unconstrained-optimization.md
      - 3. Constrained Optimization: chapters/03-constrained-optimization.md
      - 4. Stochastic Processes & Random Walks: chapters/04-stochastic-processes.md
      - 5. Spectral Representation & Estimation: chapters/05-spectral-representation.md
      - 6. Markov Chains: chapters/06-markov-chains.md
      - 7. Introduction to Queuing Theory: chapters/07-queuing-theory.md
  - Solutions:
      - Overview: solutions/index.md
      - Chapter 1 — Preliminaries: solutions/01-optimization-preliminaries.md
      - Chapter 2 — Unconstrained: solutions/02-unconstrained-optimization.md
      - Chapter 3 — Constrained: solutions/03-constrained-optimization.md
      - Chapter 4 — Stochastic Processes: solutions/04-stochastic-processes.md
      - Chapter 5 — Spectral Representation: solutions/05-spectral-representation.md
      - Chapter 6 — Markov Chains: solutions/06-markov-chains.md
      - Chapter 7 — Queuing Theory: solutions/07-queuing-theory.md
  - Assessment: assessment.md
  - Resources: resources.md
  - Feedback: feedback.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: ['dollar', 'round']    # $…$  and  \(…\)
      block_syntax:  ['dollar', 'square']   # $$…$$ and  \[…\]
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # … existing entries …
  - md_in_html
  # … your existing entries …
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
